image:
  width: 768
  height: 512
  bayer: RGGB
  raw_bits: 12
  sram_word_bits: 16
pipeline:
  blc: true
  raw_nr: false
  awb_gain: true
  demosaic: true
  ccm: true
  rgb2ycbcr: false
  chroma_nr: false
  hue: false
  lcc: false
  edge_enhance: false
blc:
  offset: 0
awb_gain:
  # 无符号 UQ4.12 寄存器编码：4096 = 1.0，范围 0..65535。
  r: 4096
  g: 4096
  b: 4096
ccm:
  # signed 16-bit 补码，12个小数位；4096=+1.0，禁止浮点交换。
  matrix:
    - [4096, 0, 0]
    - [0, 4096, 0]
    - [0, 0, 4096]
